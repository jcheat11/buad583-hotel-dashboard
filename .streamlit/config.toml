# Streamlit settings for this project.

[browser]
# Don't send anonymous usage statistics to Streamlit. The app makes no other outside calls.
gatherUsageStats = false

[server]
# Only this computer can open the app. This also stops Streamlit from looking up the
# computer's external IP address online at start-up.
address = "localhost"
# Skip Streamlit's first-run email prompt. run_app.bat opens the browser instead.
headless = true

# Torchfolio scheme: black with Mustard Yellow (#DBB940, from the West77 style guide) as the accent,
# on neutral greys. Navy/blue tones were replaced with black in Oct 2026 to match the Torchfolio logo.
# All text/background pairs below meet WCAG AA contrast (4.5:1 or better).
# Status colours (green/orange/red) are functional, not brand colours.
[theme]
base = "light"
primaryColor = "#111111"
backgroundColor = "#F8F8F7"
secondaryBackgroundColor = "#EEEEEE"
textColor = "#111111"
linkColor = "#111111"
borderColor = "#D4D4D4"
dataframeHeaderBackgroundColor = "#EBEBEB"
baseRadius = "medium"
baseFontSize = 17
headingFontWeights = [800, 700, 700, 700, 700, 700]
headingFontSizes = ["2.6rem", "1.9rem", "1.35rem", "1.2rem", "1rem", "0.9rem"]
metricValueFontWeight = 700
# Status colours (badges): distinct fills with dark text; every status also has a word and a symbol.
greenBackgroundColor = "#DCF1E3"
greenTextColor = "#14532D"
orangeBackgroundColor = "#FDE8C4"
orangeTextColor = "#7A4300"
redBackgroundColor = "#F9D6D2"
redTextColor = "#8E1D16"
grayBackgroundColor = "#EBEBEB"
grayTextColor = "#4D4D4D"
blueBackgroundColor = "#EEEEEE"
blueTextColor = "#111111"

[theme.sidebar]
backgroundColor = "#111111"
textColor = "#FFFFFF"
secondaryBackgroundColor = "#2B2B2B"
primaryColor = "#DBB940"
borderColor = "#3A3A3A"

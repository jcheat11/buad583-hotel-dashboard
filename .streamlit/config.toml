# Streamlit settings for this project.

[browser]
# Don't send anonymous usage statistics to Streamlit. The app makes no other outside calls.
gatherUsageStats = false

[server]
# Only this computer can open the app. This also stops Streamlit from looking up the
# computer's external IP address online at start-up.
address = "localhost"
# Skip Streamlit's first-run email prompt. run_app.bat opens the browser instead.
headless = true
# Serve the bundled font files in static/fonts/ from the app itself (no font service, works offline).
enableStaticServing = true

# Torchfolio scheme: black with the logo's flame orange (#FF6F00) as the accent, on neutral greys.
# (Oct 2026: navy replaced with black, then mustard yellow with orange, to match the Torchfolio logo.)
# Yellow is kept only for the "Watch" status in Properties Needing Attention.
# All text/background pairs below meet WCAG AA contrast (4.5:1 or better).
# Status colours (green/orange/red) are functional, not brand colours.
[theme]
base = "light"
primaryColor = "#111111"
backgroundColor = "#F8F8F7"
secondaryBackgroundColor = "#EEEEEE"
textColor = "#111111"
linkColor = "#111111"
borderColor = "#D4D4D4"
dataframeHeaderBackgroundColor = "#EBEBEB"
baseRadius = "medium"
baseFontSize = 17
# Typography: Space Grotesk for titles and headings, Inter for everything else (static/fonts/,
# SIL Open Font License; see static/fonts/OFL-*.txt). Bundled, so nothing is fetched at runtime.
font = "Inter, sans-serif"
headingFont = "Space Grotesk, Inter, sans-serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]   # titles and headings semibold (Space Grotesk 600)
headingFontSizes = ["2.6rem", "1.9rem", "1.35rem", "1.2rem", "1rem", "0.9rem"]
metricValueFontWeight = 700
metricValueFontSize = "1.8rem"   # fits four KPI cards across on narrower laptop/tablet widths
# Status colours (badges): distinct fills with dark text; every status also has a word and a symbol.
greenBackgroundColor = "#DCF1E3"
greenTextColor = "#14532D"
orangeBackgroundColor = "#FFE2CC"
orangeTextColor = "#8A3A00"
orangeColor = "#C24E00"
yellowBackgroundColor = "#FDE8C4"
yellowTextColor = "#7A4300"
redBackgroundColor = "#F9D6D2"
redTextColor = "#8E1D16"
grayBackgroundColor = "#EBEBEB"
grayTextColor = "#4D4D4D"
blueBackgroundColor = "#EEEEEE"
blueTextColor = "#111111"

# Variable fonts: one file covers every weight in the range.
[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/Inter-Variable.ttf"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/Inter-Italic-Variable.ttf"
weight = "100 900"
style = "italic"

[[theme.fontFaces]]
family = "Space Grotesk"
url = "app/static/fonts/SpaceGrotesk-Variable.ttf"
weight = "300 700"
style = "normal"

[theme.sidebar]
backgroundColor = "#111111"
textColor = "#FFFFFF"
secondaryBackgroundColor = "#2B2B2B"
primaryColor = "#FF6F00"
borderColor = "#3A3A3A"
